name: CI Python Web Server

on:
  push:
    branches: [ "main", "feature/leidy" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verificar-servidor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Node.js (para el túnel web)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Levantar servidor y generar link público
      run: |
        # 1. Iniciar el servidor de Python en segundo plano
        python src/suma.py &
        sleep 2
        
        # 2. Instalar y ejecutar localtunnel para obtener una URL pública
        npx localtunnel --port 8000 &
        
        # Esperar unos segundos a que se genere el enlace en los logs
        sleep 6