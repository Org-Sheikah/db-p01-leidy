name: Desplegar Calculadora Web

on:
  push:
    branches:
      - feature/leidy

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 1. Primera tarjeta: GitHub Pages (Estático)
  github-pages:
    name: GitHub Pages (Estático)
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Generar Calculadora con Django
        run: |
          mkdir public
          cd public
          python ../src/generar_django.py

      - name: Subir artefactos
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 2. Segunda tarjeta: Render Django (Dinámico)
  render-django:
    name: Render Django (Dinámico)
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: https://db-p01-leidy.onrender.com
      
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Notificar a Render
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}