name: Desplegar Calculadora Web

on:
  push:
    branches: [ "main", "feature/leidy" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar script para crear index.html
        run: python src/suma.py

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mostrar Link en la pantalla de Resumen
        run: |
          echo "### 🎉 ¡Despliegue Exitoso!" >> $GITHUB_STEP_SUMMARY
          echo "Haz clic en el enlace de abajo para abrir tu calculadora en una pestaña nueva:" >> $GITHUB_STEP_SUMMARY
          echo "👉 **[ABRIR CALCULADORA WEB](https://Org-Sheikah.github.io/db-p01-leidy/)**" >> $GITHUB_STEP_SUMMARY