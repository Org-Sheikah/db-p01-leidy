name: CI Python Web Server

on:
  push:
    branches: [ "main", "feature/leidy" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verificar-servidor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Probar ejecucion del script
      run: |
        python -c "import src.suma" || python src/suma.py &
        echo "Script verificado correctamente."

    - name: Mostrar direccion local de la pagina web
      run: |
        echo "===================================================="
        echo " ¡Servidor listo para pruebas locales!"
        echo " Direccion web de acceso: http://localhost:8000"
        echo " Ejecuta 'python src/suma.py' en tu PC para abrirla."
        echo "===================================================="