name: Desplegar Calculadora Web y Render

on:
  push:
    branches:
      - feature/leidy

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      # 1. GENERACIÓN Y DESPLIEGUE EN GITHUB PAGES
      - name: Generar Calculadora con Django
        run: |
          mkdir public
          cd public
          python ../src/generar_django.py

      - name: Subir artefactos
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 2. DISPARAR DESPLIEGUE EN RENDER
      - name: Notificar a Render para iniciar el despliegue
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

      # 3. MOSTRAR AMBOS ENLACES EN EL SUMMARY
      - name: Generar enlaces en el Summary
        run: |
          echo "🎉 **¡Despliegues Iniciados Exitosamente!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Haz clic en cualquiera de los siguientes enlaces para ver tu aplicación:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. 🌐 **Despliegue GitHub Pages:**" >> $GITHUB_STEP_SUMMARY
          echo "👉 [**ABRIR EN GITHUB PAGES**](${{ steps.deployment.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. 🚀 **Despliegue Django en Render:**" >> $GITHUB_STEP_SUMMARY
          echo "👉 [**ABRIR EN RENDER**](https://db-p01-leidy.onrender.com)" >> $GITHUB_STEP_SUMMARY